<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<div id="pb" hidden><div class="pbcard"><small>New personal best</small><h2 id="pbName"></h2><p id="pbMsg"></p></div></div>
<script>
// If app.js fails before drawing anything, show the error instead of a blank screen.
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && !a.innerHTML.trim()) a.innerHTML = '<div style="padding:40px 0"><h2>App failed to start</h2><p style="color:#8b9098">' + String(e.message || 'Unknown error').replace(/</g, '&lt;') + '</p><button onclick="location.reload()" style="padding:14px 20px">Reload</button></div>';
});
</script>
<script src="app.js?v=3"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
